# /platform content, word for word from the live site (captured 8 Nov 2026).

# Benefit cards in the carousel, in order.
benefits:
  - title: "Effective Policy"
    text: "Develop and implement effective policy for improving life cycle climate performance of buildings in public and private portfolios."
    image: /assets/img/platform/effective-policy.svg
  - title: "Reduced Emissions"
    text: "Dynamically assess buildings and portfolios using prospective LCA methods to effectively manage emission reduction."
    image: /assets/img/platform/reduced-emissions.svg
  - title: "Open Data"
    text: "Be part of the global exchange of detailed, high-quality WLC data on buildings across platforms, thanks to the openBDF format."
    image: /assets/img/platform/open-data.svg

# Feature tiles, left to right, top to bottom. icon names an include in _includes/svg/platform-<icon>.svg.
features:
  - title: "Open Building Data Format"
    text: "Facilitates open data exchange via the open building data format (openBDF)"
    icon: format
  - title: "Global Benchmarking"
    text: "Provides analytics and benchmarking against a global buildings database"
    icon: benchmarking
  - title: "Life cycle assessment"
    text: "Drives in-depth analysis of current and future WLC impacts"
    icon: lca
  - title: "From Analysis to Action"
    text: "Supports identification of effective decarbonization strategies at scale"
    icon: action
  - title: "Open API Integration"
    text: "Enables third parties to create custom instances and integrations"
    icon: api
  - title: "Custom analytics"
    text: "Tailored solutions adapted to the needs of your organization or clients"
    icon: analytics

# "From Portfolio to Policy": tabs on desktop and tablet, stacked on phones.
audiences:
  - label: "Policy Makers"
    text: "Use the open building data format (openBDF) to facilitate exchange  of building life cycle data. The open building data platform offers you open-source data management and advanced analytics to implement monitoring, verification, and reporting (MRV). We help you understand the life cycle climate performance of regional and national building stocks to design and implement effective policies."
  - label: "Portfolio Managers"
    text: "Understand the carbon footprint of buildings in your portfolio to check compliance, assess value, and identify potential for cost-effective improvements to ensure robust development of your assets through challenging times. GBDI’s open formats and platform help you facilitate data exchange across partners to reduce friction and advance insights."
  - label: "Building Designers"
    text: "Improve your design through detailed comparison against a global database of best-practice cases relevant to your context. Identify hotspots of resource use and emissions using our systematic protocol. We help you identify effective strategies for optimizing the life cycle performance of your buildings."
